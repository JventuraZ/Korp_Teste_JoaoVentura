server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/resolvedor.inc;

    set $destino_estoque     http://estoque:8081;
    set $destino_faturamento http://faturamento:8082;
    set $destino_fiscal      http://fiscal:8083;

    location /api/produtos {
        proxy_pass $destino_estoque;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /api/estoque {
        proxy_pass $destino_estoque;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /api/notas {
        proxy_pass $destino_faturamento;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /api/fiscal {
        proxy_pass $destino_fiscal;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /api/saude-faturamento {
        rewrite ^ /health break;
        proxy_pass $destino_faturamento;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
